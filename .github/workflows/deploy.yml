name: 'Terraform Azure Deployment'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform CI/CD'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environments

    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Verify Secret Availability
        run: |
          echo "=== Secret Status Check ==="
          FOUND=1
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "✓ AZURE_CREDENTIALS is set"
          else
            echo "ℹ AZURE_CREDENTIALS is not set (checking individual secrets...)"
          fi

          if [ -n "$ARM_CLIENT_ID" ]; then echo "✓ AZURE_CLIENT_ID is set"; else echo "❌ AZURE_CLIENT_ID is MISSING or EMPTY in GitHub Secrets"; FOUND=0; fi
          if [ -n "$ARM_CLIENT_SECRET" ]; then echo "✓ AZURE_CLIENT_SECRET is set"; else echo "❌ AZURE_CLIENT_SECRET is MISSING or EMPTY in GitHub Secrets"; FOUND=0; fi
          if [ -n "$ARM_SUBSCRIPTION_ID" ]; then echo "✓ AZURE_SUBSCRIPTION_ID is set"; else echo "❌ AZURE_SUBSCRIPTION_ID is MISSING or EMPTY in GitHub Secrets"; FOUND=0; fi
          if [ -n "$ARM_TENANT_ID" ]; then echo "✓ AZURE_TENANT_ID is set"; else echo "❌ AZURE_TENANT_ID is MISSING or EMPTY in GitHub Secrets"; FOUND=0; fi

          if [ -z "$AZURE_CREDENTIALS" ] && [ $FOUND -eq 0 ]; then
            echo "CRITICAL: One or more required secrets are missing or empty in GitHub Repository Settings."
            echo "Please navigate to Settings -> Secrets and variables -> Actions in your GitHub repository and add:"
            echo "  - AZURE_CLIENT_ID"
            echo "  - AZURE_CLIENT_SECRET"
            echo "  - AZURE_SUBSCRIPTION_ID"
            echo "  - AZURE_TENANT_ID"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
